services:
  # Backend service running Poem OpenAPI.
  backend:
    build:
      context: ./backend/dev
      args:
        - UID=${UID-1000}
        - GID=${UID-1000}
    depends_on:
      - postgres
      - fake-auth
    volumes:
      - ./scripts:/opt/scripts:ro
      - ./backend:/opt/backend
      - ./openapi:/opt/openapi # dev.sh will write spec.json here.

      # Use anonymous volumes to cache data on container config change.
      - backend_cargo_target_dir:/opt/cargo_target_dir
      - backend_cargo_registry:/opt/cargo_home/registry

    user: ${UID-1000}:${GID-1000}

    working_dir: /opt/backend
    environment:
      - APP_HOST=localhost
      - APP_CORS_ORIGINS=https://localhost,https://api.localhost,https://portal.localhost
      - APP_ALTCHA_SECRET=super-secret
      - APP_SMTP_HOST=maildev
      - APP_POSTGRES_PASSWORD=portal
      - APP_POSTGRES_USER=portal
      - APP_POSTGRES_DB=portal
      - APP_POSTGRES_URL=postgres://portal:portal@postgres:5432/portal?sslmode=disable
      - APP_SEED_FILE_PATH=/opt/backend/seeds/dev.sql
      # For diesel-cli
      - DATABASE_URL=postgres://portal:portal@postgres:5432/portal?sslmode=disable
    command: watchexec --restart -- ./dev/dev.sh
    labels:
      - traefik.enable=true
      - "traefik.http.routers.backend.rule=(Host(`localhost`) && PathPrefix(`/api`)) || (Host(`portal.localhost`) && PathPrefix(`/api`)) || Host(`api.localhost`)"
      - traefik.http.services.backend.loadbalancer.server.port=3000
      - traefik.http.routers.backend.tls=true
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"
      - traefik.http.routers.backend.middlewares=backend-stripprefix,fake-auth@file

  showcase-website:
    build:
      context: ./showcase-website/dev
      args:
        - UID=${UID-1000}
        - GID=${UID-1000}
    volumes:
      - ./scripts:/opt/scripts:ro
      - ./showcase-website:/opt/showcase-website
      - ./openapi:/opt/openapi # dev.sh will write spec.json here.
    user: ${UID-1000}:${GID-1000}
    working_dir: /opt/showcase-website
    entrypoint:
    command: yarn run dev2
    environment:
      - PRIVATE_API_BASE_URL=http://backend:3000
      - PUBLIC_API_BASE_URL=https://localhost/api
      - FORCE_COLOR=1
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.http.routers.showcase-website.rule=Host(`localhost`)
      - traefik.http.services.showcase-website.loadbalancer.server.port=3000
      - traefik.http.routers.showcase-website.tls=true

  portal:
    build:
      context: ./portal/dev
      args:
        - UID=${UID-1000}
        - GID=${UID-1000}
    depends_on:
      - backend
      - fake-auth
    volumes:
      - ./scripts:/opt/scripts:ro
      - ./portal:/opt/portal
      - ./openapi:/opt/openapi # dev.sh will write spec.json here.
    user: ${UID-1000}:${GID-1000}
    working_dir: /opt/portal
    command: yarn run dev
    environment:
      - FORCE_COLOR=1
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`portal.localhost`)
      - traefik.http.services.portal.loadbalancer.server.port=3000
      - traefik.http.routers.portal.tls=true

  postgres:
    image: docker.io/library/postgres:17.4-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - 5432:5432
    volumes:
      - ./docker-data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: portal
      POSTGRES_USER: portal
      POSTGRES_DB: portal

  pgweb:
    image: sosedoff/pgweb:0.16.2
    depends_on:
      - postgres
    environment:
      - PGWEB_DATABASE_URL=postgres://portal:portal@postgres:5432/portal?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgweb.rule=Host(`pgweb.localhost`)
      - traefik.http.routers.pgweb.tls=true

  # Generates an HTML documentation of the database schema (with ER diagrams).
  # Waits for the backend to listen, which happens after migrations are applied.
  # Run `just db-schema` to regenerate it after adding migrations.
  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    depends_on:
      - postgres
      - backend
    volumes:
      - ./scripts:/opt/scripts:ro
      - schemaspy_output:/output
    entrypoint:
      - bash
      - /opt/scripts/wait-for-it.sh
      - backend:3000
      - -t
      - "0"
      - --
      - /usr/local/bin/schemaspy
    command: -t pgsql11 -host postgres -port 5432 -db portal -u portal -p portal -s public

  # Serves the SchemaSpy output.
  schema-viewer:
    image: nginx:1.29-alpine
    volumes:
      - schemaspy_output:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.schema-viewer.rule=Host(`schema.localhost`)
      - traefik.http.services.schema-viewer.loadbalancer.server.port=80
      - traefik.http.routers.schema-viewer.tls=true

  # Headless browser capturing pages of the dev stack, see `just screenshot`.
  # Not started by `just dev`, only run on demand.
  screenshot:
    build:
      context: ./dev/screenshot
    profiles:
      - tools
    user: ${UID-1000}:${GID-1000}
    working_dir: /opt/screenshot
    volumes:
      - ./dev/screenshot/screenshot.mjs:/opt/screenshot/screenshot.mjs:ro
      - ./dev/screenshots:/out
    environment:
      - HOME=/tmp
      - SCREENSHOT_HOST_DIR=${PWD}/dev/screenshots
    entrypoint: ["node", "screenshot.mjs"]

  traefik:
    image: traefik:v3.6.15
    stop_signal: SIGKILL
    ports:
      # The HTTP port
      - "80:80"
      # The HTTPS port
      - "443:443"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dev/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./dev/traefik/dynamic-conf:/etc/traefik/dynamic-conf
      - ./dev/traefik/certs:/etc/traefik/certs
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls=true

  fake-auth:
    image: node:22-alpine
    volumes:
      - ./dev/fake-auth/:/app
    working_dir: /app
    stop_signal: SIGKILL
    command: node --watch index.js

  maildev:
    image: maildev/maildev:2.2.1
    labels:
      - traefik.enable=true
      - traefik.http.routers.maildev.rule=Host(`maildev.localhost`)
      - traefik.http.services.maildev.loadbalancer.server.port=1080
      - traefik.http.routers.maildev.tls=true

volumes:
  backend_cargo_target_dir:
  backend_cargo_registry:
  schemaspy_output:
