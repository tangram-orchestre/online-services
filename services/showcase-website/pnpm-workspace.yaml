# Install the dependencies before `pnpm run`/`pnpm exec` when they are out of
# date (the default, set explicitly as the dev environment relies on it).
verifyDepsBeforeRun: install

# Dependencies allowed to run their install scripts, which pnpm blocks
# otherwise.
allowBuilds:
  "@parcel/watcher": true
  # Only does something when developing altcha itself.
  altcha: false
  esbuild: true

overrides:
  sharp: ^0.35.5
