name: Cleanup old Docker Images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # every day

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old images

    permissions:
      packages: write
    steps:
      # Only untagged versions (left behind when a tag moves) are deleted: tagged
      # `sha-*` releases stay available to roll back to. Filtering tags with
      # wildcards would need a personal access token instead of GITHUB_TOKEN.
      # Children of multi-arch images are protected by the action since v3.1.0.
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: tangram-orchestre
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "showcase-website backend portal"
          tag-selection: untagged
          cut-off: 1d
