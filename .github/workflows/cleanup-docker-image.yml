name: Cleanup old Docker Images
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true
  schedule:
    - cron: "0 0 * * *" # every day

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old images

    permissions:
      packages: read
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces on top of the tag filter below, for versions that carry
      # an environment tag along with their `sha-*` tag
      - name: Fetch digests of deployed images
        id: deployed
        run: |
          digests=()
          for image in backend showcase-website portal; do
            for tag in production staging; do
              digest=$(docker buildx imagetools inspect "ghcr.io/tangram-orchestre/$image:$tag" \
                --format '{{ json .Manifest }}' 2>/dev/null | jq -r '.digest // empty' || true)
              [ -z "$digest" ] || digests+=("$digest")
            done
          done
          echo "digests=$(IFS=,; echo "${digests[*]}")" | tee -a "$GITHUB_OUTPUT"

      # Deletes release images older than 2 weeks, and untagged leftovers, but
      # always keeps the deployed images, the build caches and the 10 most
      # recent releases of each image so they stay available to roll back to.
      # Tag filters need a personal access token: GITHUB_TOKEN cannot use them.
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: tangram-orchestre
          token: ${{ secrets.PACKAGES_CLEANUP_TOKEN }}
          image-names: "backend showcase-website portal"
          image-tags: "!production !staging !cache-*"
          tag-selection: both
          cut-off: 2w
          keep-n-most-recent: 10
          skip-shas: ${{ steps.deployed.outputs.digests }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
