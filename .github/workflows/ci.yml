name: CI/CD
on:
  push:
    branches:
      - master
      - develop

# Ensure deployments are sequential
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  DOCKER_REGISTRY: ghcr.io
  MARKER_BRANCH: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
  DEPLOY_SOURCE_DIR: ${{ github.ref_name == 'master' && 'deploy/production/' || 'deploy/staging/' }}
  DEPLOY_TARGET_DIR: ${{ github.ref_name == 'master' && '/opt/services/' || '/opt/services-staging/' }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Containers
        id: build-and-push
        uses: ./.github/actions/build-containers
        with:
          PUSH_TO_REGISTRY: "true"
          FORCE_BUILD: ${{ vars.FORCE_BUILD }}
          REFERENCE_BRANCH: ${{ env.MARKER_BRANCH }}

      - name: Sync dir to server
        uses: burnett01/rsync-deployments@7.0.1
        if: vars.SKIP_DEPLOY != 'true'
        with:
          switches: -vzrp --chmod=u=rwx,g=rx,o-rwx --delete --exclude='.env'
          path: ${{ env.DEPLOY_SOURCE_DIR }}
          remote_path: ${{ env.DEPLOY_TARGET_DIR }}
          remote_host: tangram-orchestre.fr
          remote_user: ${{ secrets.DEPLOY_USERNAME }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Update services
        if: vars.SKIP_DEPLOY != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: tangram-orchestre.fr
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: ${{ env.DEPLOY_TARGET_DIR }}update.sh

      - name: Retag pushed images to marker branch (registry-side, no pull)
        if: vars.SKIP_DEPLOY != 'true'
        env:
          MARKER_BRANCH: ${{ env.MARKER_BRANCH }}
        shell: bash
        run: |
          set -eu
          echo "Saving images output to file"
          printf "%s" "${{ steps.build-and-push.outputs.images }}" > images_list.txt || true
          if [ ! -s images_list.txt ]; then
            echo "No images to retag, skipping"
            exit 0
          fi

          echo "Ensuring docker auth present (login)"
          # Re-login to ensure ~/.docker/config.json is populated for the crane container
          echo "Logging in to ${DOCKER_REGISTRY}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${DOCKER_REGISTRY} -u "${{ github.actor }}" --password-stdin

          echo "Retagging images to ${MARKER_BRANCH} using crane (containerized)"
          while IFS= read -r src || [ -n "$src" ]; do
            # src is like ghcr.io/owner/repo@sha256:...
            repo=${src%@*}
            dst="${repo}:${MARKER_BRANCH}"
            echo "Tagging $src -> $dst"
            docker run --rm -v $HOME/.docker:/root/.docker gcr.io/go-containerregistry/crane:latest tag "$src" "$dst"
          done < images_list.txt

      - uses: webfactory/ssh-agent@v0.9.0
        if: vars.SKIP_DEPLOY != 'true'
        with:
          ssh-private-key: ${{ secrets.UPDATE_BRANCH_KEY }}

      - name: Update marker branch
        if: vars.SKIP_DEPLOY != 'true'
        run: |
          git push --force origin HEAD:${{ env.MARKER_BRANCH }}
