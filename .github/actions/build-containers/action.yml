name: Build Containers
description: >-
  Builds the images that changed since the ones tagged REFERENCE_TAG and, when
  pushing, tags every image `sha-<commit>` (unchanged images become aliases of
  their REFERENCE_TAG image), so a release can always be deployed as a whole.

inputs:
  PUSH_TO_REGISTRY:
    description: Push to registry
    required: false
    default: "false"
  REFERENCE_TAG:
    description: Tag of the deployed images to compare against (production or staging)
    required: true
  FORCE_BUILD:
    description: Force build
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Configure env
      shell: bash
      run: |
        image_prefix="${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}"
        {
          echo "BACKEND_IMAGE_NAME=${image_prefix}/backend"
          echo "SHOWCASE_WEBSITE_IMAGE_NAME=${image_prefix}/showcase-website"
          echo "PORTAL_IMAGE_NAME=${image_prefix}/portal"
          echo "IMAGE_TAG=sha-${{ github.sha }}"
          # Each kind of build writes its own cache but reads all of them, so the
          # production cache only holds merged code and new builds start warm
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CACHE_TAG=cache-pr"
          else
            echo "CACHE_TAG=cache-${{ inputs.REFERENCE_TAG }}"
          fi
        } | tee -a "$GITHUB_ENV"

    # An image is rebuilt when its sources changed since the commit it was built
    # from (its revision label), or when that commit is unknown. Images already
    # pushed for this commit (e.g. deployed to the other environment) are reused
    # as they are: a sha tag never changes.
    - name: Detect changes
      shell: bash
      run: |
        set -euo pipefail

        exists() {
          if [ "${{ inputs.PUSH_TO_REGISTRY }}" = "true" ] && [ "${{ inputs.FORCE_BUILD }}" != "true" ] \
            && docker buildx imagetools inspect "$1:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$1: already built for this commit" >&2; echo true
          else
            echo false
          fi
        }

        needs_build() {
          local image=$1; shift
          local revision
          if [ "${{ inputs.FORCE_BUILD }}" = "true" ]; then
            echo "$image: forced build" >&2; echo true; return
          fi
          revision=$(docker buildx imagetools inspect "$image:${{ inputs.REFERENCE_TAG }}" --format '{{ json . }}' 2>/dev/null \
            | jq -r '[.. | objects | .["org.opencontainers.image.revision"]? // empty] | first // empty' || true)
          if [ -z "$revision" ] || ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
            echo "$image: unknown reference revision '${revision}', building" >&2; echo true; return
          fi
          if git diff --quiet "$revision" HEAD -- "$@" .github/actions/build-containers/action.yml; then
            echo "$image: unchanged since $revision" >&2; echo false
          else
            echo "$image: changed since $revision" >&2; echo true
          fi
        }

        backend_exists=$(exists "$BACKEND_IMAGE_NAME")
        website_exists=$(exists "$SHOWCASE_WEBSITE_IMAGE_NAME")
        portal_exists=$(exists "$PORTAL_IMAGE_NAME")

        backend=false website=false portal=false
        [ "$backend_exists" = true ] || backend=$(needs_build "$BACKEND_IMAGE_NAME" services/backend)
        [ "$website_exists" = true ] || website=$(needs_build "$SHOWCASE_WEBSITE_IMAGE_NAME" services/showcase-website)
        [ "$portal_exists" = true ] || portal=$(needs_build "$PORTAL_IMAGE_NAME" services/portal)

        # The website and portal embed the backend OpenAPI spec
        if [ "$backend" = true ]; then
          [ "$website_exists" = true ] || website=true
          [ "$portal_exists" = true ] || portal=true
        fi

        {
          echo "BACKEND_EXISTS=$backend_exists"
          echo "SHOWCASE_WEBSITE_EXISTS=$website_exists"
          echo "PORTAL_EXISTS=$portal_exists"
          echo "BACKEND_NEEDS_BUILD=$backend"
          echo "SHOWCASE_WEBSITE_NEEDS_BUILD=$website"
          echo "PORTAL_NEEDS_BUILD=$portal"
        } | tee -a "$GITHUB_ENV"

    - name: Docker meta Backend
      if: env.BACKEND_NEEDS_BUILD == 'true'
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        tags: type=sha,format=long
        images: ${{ env.BACKEND_IMAGE_NAME }}

    - name: Build and push Backend
      if: env.BACKEND_NEEDS_BUILD == 'true'
      uses: docker/build-push-action@v6
      with:
        context: services/backend
        push: ${{ inputs.PUSH_TO_REGISTRY }}
        # Loaded to generate the OpenAPI spec below
        load: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        annotations: ${{ steps.meta-backend.outputs.annotations }}
        cache-from: |
          type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:cache-production
          type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:cache-staging
          type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:cache-pr
        cache-to: |
          type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:${{ env.CACHE_TAG }},mode=max

    - name: Generate OpenAPI spec
      if: env.SHOWCASE_WEBSITE_NEEDS_BUILD == 'true' || env.PORTAL_NEEDS_BUILD == 'true'
      shell: bash
      run: |
        # When the backend did not change, the deployed one has the same spec
        if [ "$BACKEND_NEEDS_BUILD" = "true" ] || [ "$BACKEND_EXISTS" = "true" ]; then
          backend_image="$BACKEND_IMAGE_NAME:$IMAGE_TAG"
        else
          backend_image="$BACKEND_IMAGE_NAME:${{ inputs.REFERENCE_TAG }}"
        fi

        cd services
        docker run --rm \
          -v ./openapi:/opt/openapi \
          -e PUBLIC_OPENAPI_SPEC_PATH=/opt/openapi/public-spec.json \
          -e PRIVATE_OPENAPI_SPEC_PATH=/opt/openapi/private-spec.json \
          "$backend_image"

        cp openapi/public-spec.json showcase-website/public-spec.json
        cp openapi/private-spec.json portal/private-spec.json

    # Only download images if we're deploying the image, they're not needed to
    # check the build is passing and LFS bandwidth is limited.
    - name: Download LFS images
      if: inputs.PUSH_TO_REGISTRY == 'true' && env.SHOWCASE_WEBSITE_NEEDS_BUILD == 'true'
      shell: bash
      run: git lfs pull --include "services/showcase-website/**"

    - name: Docker meta Showcase Website
      if: env.SHOWCASE_WEBSITE_NEEDS_BUILD == 'true'
      id: meta-showcase-website
      uses: docker/metadata-action@v5
      with:
        tags: type=sha,format=long
        images: ${{ env.SHOWCASE_WEBSITE_IMAGE_NAME }}

    - name: Build and push Showcase Website
      if: env.SHOWCASE_WEBSITE_NEEDS_BUILD == 'true'
      uses: docker/build-push-action@v6
      with:
        context: services/showcase-website
        push: ${{ inputs.PUSH_TO_REGISTRY }}
        tags: ${{ steps.meta-showcase-website.outputs.tags }}
        labels: ${{ steps.meta-showcase-website.outputs.labels }}
        annotations: ${{ steps.meta-showcase-website.outputs.annotations }}
        cache-from: |
          type=registry,ref=${{ env.SHOWCASE_WEBSITE_IMAGE_NAME }}:cache-production
          type=registry,ref=${{ env.SHOWCASE_WEBSITE_IMAGE_NAME }}:cache-staging
          type=registry,ref=${{ env.SHOWCASE_WEBSITE_IMAGE_NAME }}:cache-pr
        cache-to: |
          type=registry,ref=${{ env.SHOWCASE_WEBSITE_IMAGE_NAME }}:${{ env.CACHE_TAG }},mode=max

    - name: Docker meta Portal
      if: env.PORTAL_NEEDS_BUILD == 'true'
      id: meta-portal
      uses: docker/metadata-action@v5
      with:
        tags: type=sha,format=long
        images: ${{ env.PORTAL_IMAGE_NAME }}

    - name: Build and push Portal
      if: env.PORTAL_NEEDS_BUILD == 'true'
      uses: docker/build-push-action@v6
      with:
        context: services/portal
        push: ${{ inputs.PUSH_TO_REGISTRY }}
        tags: ${{ steps.meta-portal.outputs.tags }}
        labels: ${{ steps.meta-portal.outputs.labels }}
        annotations: ${{ steps.meta-portal.outputs.annotations }}
        cache-from: |
          type=registry,ref=${{ env.PORTAL_IMAGE_NAME }}:cache-production
          type=registry,ref=${{ env.PORTAL_IMAGE_NAME }}:cache-staging
          type=registry,ref=${{ env.PORTAL_IMAGE_NAME }}:cache-pr
        cache-to: |
          type=registry,ref=${{ env.PORTAL_IMAGE_NAME }}:${{ env.CACHE_TAG }},mode=max

    # Registry-side copy, nothing is pulled or rebuilt
    - name: Tag unchanged images for this commit
      if: inputs.PUSH_TO_REGISTRY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        alias_image() {
          echo "Tagging unchanged $1:${{ inputs.REFERENCE_TAG }} as $1:$IMAGE_TAG"
          docker buildx imagetools create -t "$1:$IMAGE_TAG" "$1:${{ inputs.REFERENCE_TAG }}"
        }
        [ "$BACKEND_NEEDS_BUILD" = "true" ] || [ "$BACKEND_EXISTS" = "true" ] || alias_image "$BACKEND_IMAGE_NAME"
        [ "$SHOWCASE_WEBSITE_NEEDS_BUILD" = "true" ] || [ "$SHOWCASE_WEBSITE_EXISTS" = "true" ] || alias_image "$SHOWCASE_WEBSITE_IMAGE_NAME"
        [ "$PORTAL_NEEDS_BUILD" = "true" ] || [ "$PORTAL_EXISTS" = "true" ] || alias_image "$PORTAL_IMAGE_NAME"
