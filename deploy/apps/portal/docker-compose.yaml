services:
  portal:
    image: ghcr.io/tangram-orchestre/portal:${IMAGE_TAG:?}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      start_period: 10s
      start_interval: 2s
      interval: 30s
      retries: 3
      timeout: 5s
    networks: [apps, ingress]
    labels:
      - dev.dozzle.name=Portal
      - dev.dozzle.group=${DOZZLE_GROUP:?}
      - traefik.enable=true
      - traefik.docker.network=services
      - "traefik.http.routers.portal-${APP_ENV:?}.rule=Host(`portal.${DOMAIN:?}`)"
      # Lesser priority than the backend private router to avoid conflicts on /api prefix
      - traefik.http.routers.portal-${APP_ENV}.priority=10
      - traefik.http.routers.portal-${APP_ENV}.tls=true
      - traefik.http.routers.portal-${APP_ENV}.tls.certresolver=resolver
      - traefik.http.routers.portal-${APP_ENV}.middlewares=authentik@file

networks:
  apps: {}
  ingress:
    name: services
    external: true
