services:
  backend:
    image: ghcr.io/tangram-orchestre/backend:${IMAGE_TAG:?}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend-postgres:
        condition: service_healthy
        restart: true
    environment:
      - APP_HOST=tangram-orchestre.fr
      - APP_CORS_ORIGINS=https://www.${DOMAIN:?},https://portal.${DOMAIN},https://api.${DOMAIN}
      - APP_ALTCHA_SECRET=${APP_ALTCHA_SECRET}
      - APP_SMTP_HOST=${SMTP_HOST:?}
      # Left empty in staging to send mails to MailDev without authentication
      - APP_SMTP_NAME=${APP_SMTP_NAME:-}
      - APP_SMTP_PASSWORD=${APP_SMTP_PASSWORD:-}
      - APP_POSTGRES_URL=postgres://portal:${APP_POSTGRES_PASSWORD}@backend-postgres:5432/portal?sslmode=disable
      - APP_SEED_FILE_PATH=${BACKEND_SEED_FILE:-}
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/public/health"]
      # Leaves time for database migrations
      start_period: 60s
      start_interval: 2s
      interval: 30s
      retries: 3
      timeout: 5s
    networks:
      apps:
        # Unique name so the website never reaches the other environment's backend
        aliases: ["backend-${APP_ENV:?}"]
      ingress: {}
    labels:
      - dev.dozzle.name=Backend
      - dev.dozzle.group=${DOZZLE_GROUP:?}
      - traefik.enable=true
      - traefik.docker.network=services
      # Public Router (for the showcase website)
      - "traefik.http.routers.backend-public-${APP_ENV}.rule=Host(`www.${DOMAIN}`) && PathPrefix(`/api/public`)"
      - traefik.http.routers.backend-public-${APP_ENV}.priority=20
      - traefik.http.routers.backend-public-${APP_ENV}.tls=true
      - traefik.http.routers.backend-public-${APP_ENV}.tls.certresolver=resolver
      - traefik.http.routers.backend-public-${APP_ENV}.middlewares=${BACKEND_PUBLIC_MIDDLEWARES:?}
      # Private Router (for the portal and the API subdomain)
      - "traefik.http.routers.backend-private-${APP_ENV}.rule= \
        Host(`api.${DOMAIN}`) || \
        Host(`portal.${DOMAIN}`) && PathPrefix(`/api`)"
      - traefik.http.routers.backend-private-${APP_ENV}.priority=20
      - traefik.http.routers.backend-private-${APP_ENV}.tls=true
      - traefik.http.routers.backend-private-${APP_ENV}.tls.certresolver=resolver
      - traefik.http.routers.backend-private-${APP_ENV}.middlewares=authentik@file,strip-api@file

  backend-postgres:
    image: docker.io/library/postgres:17.4-alpine
    restart: unless-stopped
    labels:
      - dev.dozzle.name=Backend PostgreSQL
      - dev.dozzle.group=${DOZZLE_GROUP}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    networks: [apps]
    volumes:
      - ${BACKEND_DB_DIR:?}:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_USER: portal
      POSTGRES_DB: portal

  backend-postgres-backup:
    image: docker.io/library/postgres:17.4-alpine
    restart: unless-stopped
    labels:
      - dev.dozzle.name=Backend Postgres Backup
      - dev.dozzle.group=${DOZZLE_GROUP}
    depends_on:
      backend-postgres:
        condition: service_healthy
    networks: [apps]
    volumes:
      - ${BACKEND_DB_BACKUP_DIR:?}:/opt/db-backups
      - ./postgres-backup-crontab:/etc/crontabs/root:ro
    environment:
      PGPASSWORD: ${APP_POSTGRES_PASSWORD}
      PGUSER: portal
      PGDATABASE: portal
      PGHOST: backend-postgres
    command: crond -f -l 8

networks:
  apps: {}
  ingress:
    name: services
    external: true
