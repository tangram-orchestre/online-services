- name: Setup hosting environment with deploy user and Docker rootless
  hosts: webservers
  become: true
  any_errors_fatal: true
  vars:
    # Public counterpart of the DEPLOY_KEY GitHub Actions secret
    deploy_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDSlRxA37xb3hWLFq5x/Lirr9XhQXhJBt8mLNm2te7VI github-actions-deploy"
  tasks:
    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        state: present
        shell: /bin/bash
      register: deploy_user_info

    # sshd StrictModes rejects group-writable key files as soon as the deploy
    # group has other members, so keep these strictly owner-only.
    - name: Create deploy user .ssh folder
      ansible.builtin.file:
        path: "/home/deploy/.ssh"
        state: directory
        owner: deploy
        group: deploy
        mode: '0700'

    - name: Install deploy user authorized_keys
      ansible.builtin.copy:
        dest: "/home/deploy/.ssh/authorized_keys"
        content: "{{ deploy_ssh_public_key }}\n"
        owner: deploy
        group: deploy
        mode: '0600'

    - name: Create deploy folders
      ansible.builtin.file:
        path: "/opt/{{ item }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      loop:
        - containerd
        - db-backups
        - docker-volumes
        - docker-volumes-no-backup
        - rclone
        - services
        - services-staging

    - name: Install required packages
      ansible.builtin.package:
        name:
          - rsync
        state: present

    - name: Install Docker rootless
      ansible.builtin.import_role:
        name: konstruktoid.docker_rootless
      vars:
        docker_user: deploy
        docker_rootful: true
        docker_allow_privileged_ports: true
        docker_compose: true

    - name: Set DOCKER_HOST for deploy user
      ansible.builtin.lineinfile:
        path: "/home/deploy/.bashrc"
        line: 'export DOCKER_HOST=unix:///run/user/{{ deploy_user_info.uid }}/docker.sock'
        create: true
        mode: '0644'

    - name: Create .docker_env file for deploy user
      ansible.builtin.lineinfile:
        path: "/home/deploy/.docker_env"
        line: 'export DOCKER_HOST=unix:///run/user/{{ deploy_user_info.uid }}/docker.sock'
        create: true
        mode: '0644'

    - name: Create .env file for services
      ansible.builtin.copy:
        dest: "/opt/services/.env"
        content: |
          UID={{ deploy_user_info.uid }}
        owner: deploy
        group: deploy
        mode: '0600'
