# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Groups the applications rely on. Their members are managed in the Authentik
# UI, the blueprint only makes sure the groups exist.
version: 1
metadata:
  name: Tangram - Groups
  labels:
    blueprints.goauthentik.io/description: Groups used by the applications' access rules and the X-App-Groups header
entries:
  # Members of the orchestra organisation: see the portal's organisation pages.
  - model: authentik_core.group
    identifiers:
      name: Orga
  # Board members: can edit in the portal.
  - model: authentik_core.group
    identifiers:
      name: Bureau
  # Maintainers: infrastructure tools and staging.
  - model: authentik_core.group
    identifiers:
      name: Devs
    attrs:
      # Sent to Kopia by its provider (applications.yaml), so its own login
      # never shows up. From infra/authentik/.env, the same as in infra/kopia/.env.
      attributes:
        kopia-username: !Env KOPIA_WEB_USERNAME
        kopia-password: !Env KOPIA_WEB_PASSWORD

  # Built into Authentik. Its attributes used to hold the Kopia credentials.
  - model: authentik_core.group
    identifiers:
      name: authentik Admins
    attrs:
      attributes: {}
