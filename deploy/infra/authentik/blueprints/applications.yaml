# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The portal and the backend, protected by Traefik's `authentik` forward-auth
# middleware (deploy/infra/traefik/dynamic-conf/authentik-middleware.yaml).
# Also used by the local Authentik of `just dev-authentik`, on the domain of
# TANGRAM_DOMAIN. The other applications are in production/infrastructure.yaml.
#
# Each one is a proxy provider in forward auth mode, served by the embedded
# outpost, and an application whose policy bindings decide who may open it.
# An application without bindings is open to every logged in user.
version: 1
metadata:
  name: Tangram - Applications
  labels:
    blueprints.goauthentik.io/description: The portal and the backend, the X-App-* headers and who may open them
context:
  domain: &domain !Env [TANGRAM_DOMAIN, tangram-orchestre.fr]
  # Shared by the providers below, through YAML anchors.
  provider: &provider
    mode: forward_single
    authentication_flow: !Find [authentik_flows.flow, [slug, login]]
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, logged-out]]
    access_token_validity: hours=24
    intercept_header_auth: true
  scopes: &scopes
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
  # The same, plus the X-App-* headers the backend and the portal read.
  scopes_with_app_headers: &scopes_with_app_headers
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
    - !KeyOf app-headers
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Tangram - Groups
      required: true
  # The login and logout pages
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Tangram - Flows
      required: true

  # Identity headers forwarded to the backend and the portal. Traefik only
  # passes on the headers listed in the middleware's authResponseHeaders, and
  # dev/fake-auth sets the same ones locally.
  - model: authentik_providers_oauth2.scopemapping
    id: app-headers
    identifiers:
      name: Backend Auth Headers
    attrs:
      scope_name: ak_proxy
      description: Adds auth Headers for Backend
      expression: |
        return {
            "ak_proxy": {
                "user_attributes": {
                    "additionalHeaders": {
                        "X-App-UserId": str(request.user.pk),
                        "X-App-User": request.user.username,
                        "X-App-Email": request.user.email,
                        "X-App-Groups": ",".join([group.name for group in user.groups.all()]),
                    }
                }
            }
        }

  - model: authentik_providers_proxy.proxyprovider
    id: provider-portal
    identifiers:
      name: Provider for Portal
    attrs:
      <<: *provider
      external_host: !Format ["https://portal.%s", *domain]
      property_mappings: *scopes_with_app_headers
  - model: authentik_core.application
    id: portal
    identifiers:
      slug: portal
    attrs:
      name: Portal
      provider: !KeyOf provider-portal
      group: ""
  # No binding: every member can log into the portal, the backend checks the
  # groups of each request.

  - model: authentik_providers_proxy.proxyprovider
    id: provider-backend
    identifiers:
      name: Provider for Backend
    attrs:
      <<: *provider
      external_host: !Format ["https://api.%s", *domain]
      property_mappings: *scopes_with_app_headers
  - model: authentik_core.application
    id: backend
    identifiers:
      slug: backend
    attrs:
      name: Backend
      provider: !KeyOf provider-backend
      group: ""
  # The portal reaches the backend through portal.<domain>/api, the API domain
  # is for developers.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf backend
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0
