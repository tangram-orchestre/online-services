# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The other applications protected by Traefik's `authentik` forward-auth
# middleware: staging, which shares this Authentik instance, and the
# infrastructure tools. Production only, unlike applications.yaml.
version: 1
metadata:
  name: Tangram - Infrastructure
  labels:
    blueprints.goauthentik.io/description: Staging and infrastructure applications, who may open each one, and the embedded outpost
context:
  # Shared by the providers below, through YAML anchors.
  provider: &provider
    mode: forward_single
    authentication_flow: !Find [authentik_flows.flow, [slug, login]]
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, logged-out]]
    access_token_validity: hours=24
    intercept_header_auth: true
  scopes: &scopes
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
  # The same, plus the X-App-* headers (applications.yaml), for staging.
  scopes_with_app_headers: &scopes_with_app_headers
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
    - !Find [authentik_providers_oauth2.scopemapping, [name, Backend Auth Headers]]
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Tangram - Applications
      required: true

  # ------------------------------------------------------------------- Staging

  - model: authentik_providers_proxy.proxyprovider
    id: provider-portal-staging
    identifiers:
      name: Provider for Portal Staging
    attrs:
      <<: *provider
      external_host: https://portal.staging.tangram-orchestre.fr
      property_mappings: *scopes_with_app_headers
  - model: authentik_core.application
    id: portal-staging
    identifiers:
      slug: portal-staging
    attrs:
      name: Portal Staging
      provider: !KeyOf provider-portal-staging
      group: Staging
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf portal-staging
      group: !Find [authentik_core.group, [name, Orga]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf portal-staging
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-backend-staging
    identifiers:
      name: Provider for Backend Staging
    attrs:
      <<: *provider
      external_host: https://api.staging.tangram-orchestre.fr
      property_mappings: *scopes_with_app_headers
  - model: authentik_core.application
    id: backend-staging
    identifiers:
      slug: backend-staging
    attrs:
      name: Backend Staging
      provider: !KeyOf provider-backend-staging
      group: Staging
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf backend-staging
      group: !Find [authentik_core.group, [name, Orga]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf backend-staging
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  # Staging's website and public API, private unlike in production.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-showcase-website-staging
    identifiers:
      name: Provider for Showcase Website Staging
    attrs:
      <<: *provider
      external_host: https://www.staging.tangram-orchestre.fr
      property_mappings: *scopes
  - model: authentik_core.application
    id: showcase-website-staging
    identifiers:
      slug: showcase-website-staging
    attrs:
      name: Showcase Website Staging
      provider: !KeyOf provider-showcase-website-staging
      group: Staging
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf showcase-website-staging
      group: !Find [authentik_core.group, [name, Orga]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf showcase-website-staging
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-maildev
    identifiers:
      name: Provider for Maildev
    attrs:
      <<: *provider
      external_host: https://maildev.tangram-orchestre.fr
      property_mappings: *scopes
  - model: authentik_core.application
    id: maildev
    identifiers:
      slug: maildev
    attrs:
      name: Maildev
      provider: !KeyOf provider-maildev
      group: IT
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf maildev
      group: !Find [authentik_core.group, [name, Orga]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf maildev
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  # Shows the forwarded headers, to debug them.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-whoami
    identifiers:
      name: Provider for whoami
    attrs:
      <<: *provider
      external_host: https://whoami.tangram-orchestre.fr
      property_mappings: *scopes_with_app_headers
  - model: authentik_core.application
    id: whoami
    identifiers:
      slug: whoami
    attrs:
      name: whoami
      provider: !KeyOf provider-whoami
      group: IT
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf whoami
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  # ------------------------------------------------------------ Infrastructure

  - model: authentik_providers_proxy.proxyprovider
    id: provider-traefik
    identifiers:
      name: Provider for Traefik
    attrs:
      <<: *provider
      external_host: https://traefik.tangram-orchestre.fr
      property_mappings: *scopes
  - model: authentik_core.application
    id: traefik
    identifiers:
      slug: traefik
    attrs:
      name: Traefik
      provider: !KeyOf provider-traefik
      group: IT
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf traefik
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf traefik
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-dozzle
    identifiers:
      name: Provider for Dozzle
    attrs:
      <<: *provider
      external_host: https://dozzle.tangram-orchestre.fr
      property_mappings: *scopes
  - model: authentik_core.application
    id: dozzle
    identifiers:
      slug: dozzle
    attrs:
      name: Dozzle
      provider: !KeyOf provider-dozzle
      group: IT
      meta_launch_url: https://dozzle.tangram-orchestre.fr
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dozzle
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  # Logs into Kopia's web UI with HTTP basic auth, from the credentials set on
  # the Devs group below. Traefik passes the header on through the
  # `authentik-basic-auth` middleware.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-kopia
    identifiers:
      name: Provider for Kopia
    attrs:
      <<: *provider
      external_host: https://kopia.tangram-orchestre.fr
      property_mappings: *scopes
      basic_auth_enabled: true
      basic_auth_user_attribute: kopia-username
      basic_auth_password_attribute: kopia-password
  - model: authentik_core.application
    id: kopia
    identifiers:
      slug: kopia
    attrs:
      name: Kopia
      provider: !KeyOf provider-kopia
      group: IT
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kopia
      group: !Find [authentik_core.group, [name, Devs]]
    attrs:
      order: 0

  # Kopia's credentials, sent by its provider above so its own login never
  # shows up. From infra/authentik/.env, the same as in infra/kopia/.env.
  - model: authentik_core.group
    identifiers:
      name: Devs
    attrs:
      attributes:
        kopia-username: !Env KOPIA_WEB_USERNAME
        kopia-password: !Env KOPIA_WEB_PASSWORD
  # Built into Authentik. Its attributes used to hold the Kopia credentials.
  - model: authentik_core.group
    identifiers:
      name: authentik Admins
    attrs:
      attributes: {}

  # ------------------------------------------------------------------- Outpost

  # The outpost built into the Authentik server answers Traefik's forward auth
  # requests, for exactly these providers.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Provider for Portal]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Provider for Backend]]
        - !KeyOf provider-portal-staging
        - !KeyOf provider-backend-staging
        - !KeyOf provider-showcase-website-staging
        - !KeyOf provider-maildev
        - !KeyOf provider-whoami
        - !KeyOf provider-traefik
        - !KeyOf provider-dozzle
        - !KeyOf provider-kopia
