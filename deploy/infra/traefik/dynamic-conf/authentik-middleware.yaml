http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          # All authentik headers, we don't need to forward them
          # - X-authentik-username
          # - X-authentik-groups
          # - X-authentik-email
          # - X-authentik-name
          # - X-authentik-uid
          # - X-authentik-jwt
          # - X-authentik-meta-jwks
          # - X-authentik-meta-outpost
          # - X-authentik-meta-provider
          # - X-authentik-meta-app
          # - X-authentik-meta-X-authentik-meta-version

          # App headers for portal
          - X-App-UserId
          - X-App-User
          - X-App-Email
          - X-App-Groups
          - X-App-LastName
          - X-App-FirstName
          - X-App-PhoneNumber

    # The same, also passing on the HTTP basic auth that Authentik sends for
    # providers with basic auth enabled (Kopia). Kept apart from `authentik` as
    # Traefik replaces the listed headers of the request with Authentik's, which
    # would drop the Authorization header the other services receive.
    authentik-basic-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - Authorization
